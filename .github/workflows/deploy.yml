name: CI and GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Allow one deploy at a time, and let a newer push supersede a queued one
# rather than cancelling a deploy that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # Catch server-only code before the build does, with a message that
      # explains the deployment choice rather than just the mechanism.
      - run: npm run check:static

      - run: npm run build
        env:
          # Stamped into the exported HTML so the smoke job can prove the site
          # it fetches is the one this run built. Explicit rather than reading
          # Actions' implicit GITHUB_SHA, so the wiring is visible here.
          BUILD_COMMIT: ${{ github.sha }}

      - name: Assert Jekyll is disabled
        run: test -f out/.nojekyll

      # Browser checks run against the real export under its base path, and
      # they gate the deploy: `deploy` needs this job, so a build whose UI is
      # broken never reaches Pages. Each spec here exists because that bug
      # actually shipped once.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - uses: actions/upload-pages-artifact@v3
        # Only the run that can deploy needs to publish the artifact.
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: out

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4

  # "The artifact uploaded" is not "the page loads". This fetches what was
  # actually published; it can only run after a real deployment, so it has no
  # equivalent on a pull request.
  smoke:
    name: Smoke-test the deployed site
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No npm ci: the script uses only Node builtins.
      - run: npm run smoke
        env:
          SMOKE_URL: ${{ needs.deploy.outputs.page_url }}
          # Same SHA the build stamped in. A mismatch means the publish did not
          # replace what is being served, which every other assertion here
          # would sail straight past.
          EXPECTED_COMMIT: ${{ github.sha }}
